<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Era</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#f7f7f4;--text:#16181b;--muted:#5d6670;--accent:#0f8a5f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1216;--text:#e8edf2;--muted:#9aa5b1;--accent:#34d399}}
:root[data-theme="dark"]{--bg:#0f1216;--text:#e8edf2;--muted:#9aa5b1;--accent:#34d399}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 16px}
img{width:64px;height:64px;border-radius:14px}
h1{margin:12px 0 4px;font-size:30px}
p{color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>New Era</h1>
  <p>A Chrome extension for paper-trading Solana memecoins on the sites you already use, with live prices, token filters and trading rules it actually enforces. No wallet, no real money, no account.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
